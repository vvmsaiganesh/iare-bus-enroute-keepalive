name: chain-test
on:
  workflow_dispatch:
    inputs:
      depth:
        description: depth
        required: false
        default: "0"
permissions:
  actions: write
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: maybe dispatch next
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          d="${{ inputs.depth }}"
          echo "depth=$d"
          if [ "$d" -lt 2 ]; then
            next=$((d + 1))
            echo "dispatching depth=$next"
            curl -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/chain-test.yml/dispatches" \
              -d "{\"ref\":\"main\",\"inputs\":{\"depth\":\"$next\"}}" \
              -w '\nHTTP %{http_code}\n'
          else
            echo "chain end"
          fi
